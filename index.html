<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f5f7fb;
      }

      main {
        width: min(100% - 2rem, 440px);
        padding: 2rem;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 10%);
      }

      h1 {
        margin-top: 0;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      form {
        display: flex;
        gap: 0.75rem;
      }

      input {
        min-width: 0;
        flex: 1;
        padding: 0.7rem 0.8rem;
        border: 1px solid #aab3c2;
        border-radius: 6px;
        font: inherit;
      }

      button {
        padding: 0.7rem 1rem;
        border: 0;
        border-radius: 6px;
        background: #1668e3;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: #0d55bc;
      }

      #result {
        min-height: 1.25rem;
        margin: 1rem 0 0;
        white-space: pre-wrap;
      }

      #result.error {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>WA State Sales Tax Lookup</h1>
      <h2>Search for a location to find its sales tax rate.</h2>
      <form id="search-form">
        <label for="search-input" class="sr-only">Search query</label>
        <input id="search-input" name="query" type="search" placeholder="Enter a location" required />
        <button type="submit">Find Tax Rate</button>
      </form>
      <div id="result" aria-live="polite"></div>
    </main>

    <script>
      const form = document.querySelector('#search-form');
      const input = document.querySelector('#search-input');
      const result = document.querySelector('#result');

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const textQuery = input.value.trim();
        result.textContent = 'Searching…';
        result.classList.remove('error');

        fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ textQuery }),
        })
          .then(async (response) => {
            const responseText = await response.text();
            let data;

            try {
              data = responseText ? JSON.parse(responseText) : {};
            } catch {
              data = { rawResponse: responseText };
            }

            if (!response.ok) {
              const details = data.error
                ? JSON.stringify(data.error, null, 2)
                : data.rawResponse || 'No error details were returned.';
              throw new Error(`Request failed (${response.status} ${response.statusText})\n${details}`);
            }
            return data;
          })
          .then(({ places = [], tax }) => {
            const [place] = places;
            if (!place) {
              result.textContent = 'No places found.';
              return;
            }

            const name = place.displayName?.text || 'Unnamed place';
            const formattedAddress = place.formattedAddress || 'Address unavailable';
            result.replaceChildren();

            const nameElement = document.createElement('strong');
            nameElement.textContent = name;
            const addressElement = document.createElement('span');
            addressElement.textContent = formattedAddress;
            result.append(nameElement, document.createElement('br'), addressElement);

            if (tax) {
              const taxDetails = document.createElement('div');
              taxDetails.append(
                document.createElement('br'),
                `Location Code: ${tax.locCode || 'Unavailable'}`,
                document.createElement('br'),
                `Tax Name: ${tax.taxName}`,
                document.createElement('br'),
                `Tax Rate: ${formatTaxRate(tax.rate)}`,
              );
              result.append(taxDetails);
            }
          })
          .catch((error) => {
            result.classList.add('error');
            result.textContent = [
              'Search failed.',
              `Name: ${error.name || 'UnknownError'}`,
              `Message: ${error.message || String(error)}`,
              error.stack ? `Stack:\n${error.stack}` : '',
            ]
              .filter(Boolean)
              .join('\n\n');
          });
      });

      function formatTaxRate(rate) {
        const decimalRate = Number(rate);
        if (!Number.isFinite(decimalRate)) return 'Unavailable';

        return new Intl.NumberFormat('en-US', {
          style: 'percent',
          minimumFractionDigits: 0,
          maximumFractionDigits: 3,
        }).format(decimalRate);
      }
    </script>
  </body>
</html>
